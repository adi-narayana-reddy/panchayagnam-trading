version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: panchayagnam-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_in_prod}
      MYSQL_DATABASE: ${DB_NAME:-panchayagnam}
      MYSQL_USER: ${DB_USER:-py_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-py_pass_change_in_prod}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - py-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # Core Backend Service (Spring Boot)
  core-service:
    build:
      context: ./panchayagnam-service-main
      dockerfile: Dockerfile
    container_name: panchayagnam-core
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-panchayagnam}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-py_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-py_pass_change_in_prod}
      JWT_SECRET: ${JWT_SECRET:-ReplaceWith64ByteRandomHexSecretKeyForProductionSignatures}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-true}
      BROKER_SERVICE_URL: http://broker-service:8082
    ports:
      - "8083:8083"
    networks:
      - py-network

  # Broker Microservice (Spring Boot)
  broker-service:
    build:
      context: ./py-broker-service-main
      dockerfile: Dockerfile
    container_name: panchayagnam-broker
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      TRADING_PAPER_TRADING_ENABLED: ${PAPER_TRADING_ENABLED:-true}
    ports:
      - "8082:8082"
    networks:
      - py-network

  # Frontend Web UI (Flutter Web + Nginx)
  frontend:
    build:
      context: ./panchayagnam-ui-main
      dockerfile: Dockerfile
    container_name: panchayagnam-ui
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - py-network

networks:
  py-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
