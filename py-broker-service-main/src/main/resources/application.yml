server:
  port: ${BROKER_SERVICE_PORT:8082}

spring:
  application:
    name: py-broker-service

logging:
  config: classpath:log4j2.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /py-angel
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    doc-expansion: none

smartapi:
  key: ${SMARTAPI_KEY:default_key}

trading:
  paper-trading:
    enabled: ${PAPER_TRADING_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
