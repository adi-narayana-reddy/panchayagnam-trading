name: Backend Services Build & Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Core Service Unit Tests
        working-directory: ./panchayagnam-service-main
        run: mvn test -Dtest=TwilioOtpServiceTest -B

      - name: Build Panchayagnam Core Service
        working-directory: ./panchayagnam-service-main
        run: mvn clean package -DskipTests -B

      - name: Build Py Broker Microservice
        working-directory: ./py-broker-service-main
        run: mvn clean package -DskipTests -B
